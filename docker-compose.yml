services: 
  db: 
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: research
      POSTGRES_PASSWORD: research
      POSTGRES_DB: research
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U research -d research"]
      interval: 5s
      timeout: 5s
      retries: 5

  
  app:
    build: .
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://research:research@db:5432/research
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    volumes: 
      - ./data/papers:/app/data/papers

volumes:
  pgdata: